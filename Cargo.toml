[workspace]
resolver = "2"
members = ["crates/core", "crates/backend-linux", "crates/backend-windows", "crates/cli", "crates/gui"]

# A bare `cargo build` must work on a fresh clone, on either platform. `members` knows
# nothing about targets, so it would drag the foreign backend in and fail to compile it;
# `cli` and `gui` already pick the right one through `[target.'cfg(target_os = ...)']`.
#
# The price: `cargo test` on its own now leaves the backend's own tests out, and
# `--workspace` is not the way back - that asks for the foreign backend again. Name your
# own backend instead, which is also the one command that reads the same on both systems:
#   cargo test --release -p mirrik-core -p mirrik-backend-linux -p mirrik-cli -p mirrik-gui
default-members = ["crates/core", "crates/cli", "crates/gui"]

# Kept here so the five crates cannot drift apart on version, edition or licence.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared dependencies in one place, so the Linux and Windows backends cannot drift
# apart on a version.
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

mirrik-core = { path = "crates/core" }
mirrik-backend-linux = { path = "crates/backend-linux" }
mirrik-backend-windows = { path = "crates/backend-windows" }

[profile.release]
# A small tool that starts fast: it is opened by a keystroke, not left running.
opt-level = "s"
lto = true
strip = true
