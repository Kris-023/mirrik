[package]
name = "mirrik-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Play the same sound on two or more output devices at once"

[[bin]]
name = "mirrik"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
mirrik-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mirrik-backend-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mirrik-backend-windows.workspace = true
# Only to tell a double-click apart from a shell invocation and to get rid of the console
# window that comes with it, see main().
windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
