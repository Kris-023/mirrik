[package]
name = "mirrik-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Window for Mirrik: pick the devices to mirror sound to"

[[bin]]
name = "mirrik-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
mirrik-core.workspace = true

# glow rather than wgpu: the window has to be there the moment the key is pressed, not
# after a graphics stack has started. `default-features = false` drops the persistence
# feature among others, which would have nothing here to save.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
] }

[target.'cfg(target_os = "linux")'.dependencies]
mirrik-backend-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mirrik-backend-windows.workspace = true
